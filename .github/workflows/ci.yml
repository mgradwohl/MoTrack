name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
      - name: Set up Windows SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Select Windows LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM/bin'
          $llvm | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_BIN=$llvm" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Linux LLVM and Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-format-18 clang-tidy-18 llvm-18 libgl1-mesa-dev libxkbcommon-dev
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
          echo LLVM_BIN=/usr/lib/llvm-18/bin >> "$GITHUB_ENV"
      - name: Select Apple Clang
        if: runner.os == 'macOS'
        run: |
          llvm="$(dirname "$(xcrun --find clang++)")"
          echo "$llvm" >> "$GITHUB_PATH"
          echo "LLVM_BIN=$llvm" >> "$GITHUB_ENV"
      - name: Configure and build
        run: |
          cmake --preset coverage
          cmake --build --preset coverage
      - name: Check C++ format and static analysis
        if: runner.os == 'Linux'
        run: |
          git ls-files -z -- '*.cpp' '*.hpp' | xargs -0 clang-format --dry-run --Werror
          git ls-files -z -- '*.cpp' | xargs -0 clang-tidy -p build/coverage
      - name: Test and collect coverage
        shell: bash
        run: python tools/coverage.py collect build/coverage coverage.json --llvm-bin "$LLVM_BIN"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.json
          if-no-files-found: error
  coverage:
    name: 90% line coverage
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: reports
      - run: python3 tools/coverage.py check reports/*/coverage.json
