name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Tracker application reference
        if: runner.os == 'Linux'
        run: |
          python tools/corpus.py fetch
          python tools/corpus.py reference --java "$JAVA_HOME_17_X64/bin/java"
          python tools/corpus.py session --java "$JAVA_HOME_17_X64/bin/java"
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
      - name: Set up Windows SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Select Windows LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM/bin'
          $llvm | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_BIN=$llvm" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          choco install ccache --yes --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "$env:ChocolateyInstall/bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Linux LLVM and Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache clang-18 clang-format-18 clang-tidy-18 llvm-18 libgl1-mesa-dev libxkbcommon-dev
          sudo apt-get install -y build-essential pkg-config autoconf automake libtool nasm patchelf libxcb-cursor0
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
          echo LLVM_BIN=/usr/lib/llvm-18/bin >> "$GITHUB_ENV"
      - name: Select Apple Clang
        if: runner.os == 'macOS'
        run: |
          brew install ccache pkgconf autoconf automake libtool nasm
          llvm="$(dirname "$(xcrun --find clang++)")"
          echo "$llvm" >> "$GITHUB_PATH"
          echo "LLVM_BIN=$llvm" >> "$GITHUB_ENV"
      - name: Restore pinned vcpkg bootstrap
        id: vcpkg-bootstrap-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .dev-tools/vcpkg
            !.dev-tools/vcpkg/buildtrees/**
            !.dev-tools/vcpkg/packages/**
            !.dev-tools/vcpkg/installed/**
            !.dev-tools/vcpkg/downloads/**
            !.dev-tools/vcpkg/binary-cache/**
          key: vcpkg-bootstrap-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/media_sdk.py') }}
      - name: Verify and prepare pinned vcpkg bootstrap
        shell: bash
        run: python tools/media_sdk.py bootstrap
      - name: Save verified vcpkg bootstrap
        if: steps.vcpkg-bootstrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .dev-tools/vcpkg
            !.dev-tools/vcpkg/buildtrees/**
            !.dev-tools/vcpkg/packages/**
            !.dev-tools/vcpkg/installed/**
            !.dev-tools/vcpkg/downloads/**
            !.dev-tools/vcpkg/binary-cache/**
          key: ${{ steps.vcpkg-bootstrap-cache.outputs.cache-primary-key }}
      - uses: actions/cache@v4
        with:
          path: .dev-tools/vcpkg-binary-cache
          key: ffmpeg-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/media_sdk.py') }}
          restore-keys: ffmpeg-sdk-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up pinned media libraries
        shell: bash
        run: |
          python tools/media_sdk.py install
          prefix="$(python tools/media_sdk.py prefix)"
          echo "MOTRACK_FFMPEG_ROOT=$prefix" >> "$GITHUB_ENV"
          if [[ -d "$prefix/bin" ]]; then echo "$prefix/bin" >> "$GITHUB_PATH"; fi
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', '.github/workflows/ci.yml') }}-
      - name: Configure and build
        shell: bash
        run: |
          ccache --version
          cmake --preset coverage -DMOTRACK_BUILD_BENCHMARKS=ON
          cmake --build --preset coverage
          ccache --show-stats
      - name: Check C++ format and static analysis
        if: runner.os == 'Linux'
        run: |
          git ls-files -z -- '*.cpp' '*.hpp' | xargs -0 clang-format --dry-run --Werror
          git ls-files -z -- 'src/*.cpp' 'tests/*.cpp' 'benchmarks/*.cpp' | xargs -0 -n 1 -P 2 clang-tidy -p build/coverage
      - name: Check Windows setup scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          tools/setup-dev.ps1 -DryRun -Build
          tools/check-prereqs.ps1
      - name: Test and collect coverage
        shell: bash
        run: python tools/coverage.py collect build/coverage coverage.json --llvm-bin "$LLVM_BIN"
      - name: Check Tracker reference corpus
        shell: bash
        run: |
          python -m unittest discover -s tests -p test_corpus.py
          python tools/corpus.py fetch
          probe=build/coverage/motrack_corpus_probe
          if [[ "$RUNNER_OS" == Windows ]]; then probe="$probe.exe"; fi
          python tools/corpus.py check --probe "$probe"
      - name: Check edited Tracker round trip
        if: runner.os == 'Linux'
        shell: bash
        run: python tools/corpus.py roundtrip --probe build/coverage/motrack_corpus_probe --java "$JAVA_HOME_17_X64/bin/java"
      - name: Stage desktop build
        shell: bash
        run: |
          cmake --preset stage
          cmake --build --preset stage
          cmake --install build/stage --prefix "$PWD/build/stage/installed"
      - name: Smoke test staged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH,Env:QT_QPA_PLATFORM_PLUGIN_PATH,Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          & ./build/stage/installed/bin/motrack.exe --smoke-test tests/fixtures/image-sequence.trk
          exit $LASTEXITCODE
      - name: Smoke test staged Unix app
        if: runner.os != 'Windows'
        shell: bash
        run: |
          app=build/stage/installed/bin/motrack
          unset QT_PLUGIN_PATH QT_QPA_PLATFORM_PLUGIN_PATH QT_QPA_PLATFORM LD_LIBRARY_PATH DYLD_LIBRARY_PATH DYLD_FRAMEWORK_PATH
          if [[ "$RUNNER_OS" == macOS ]]; then
            bundle=build/stage/installed/motrack.app/Contents
            test -f "$bundle/Frameworks/QtXml.framework/QtXml"
            app="$bundle/MacOS/motrack"
          else
            test -f build/stage/installed/plugins/platforms/libqxcb.so
            export QT_QPA_PLATFORM=offscreen
          fi
          PATH=/usr/bin:/bin "$app" --smoke-test tests/fixtures/image-sequence.trk
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.json
          if-no-files-found: error
  coverage:
    name: 90% line coverage
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: reports
      - run: python3 tools/coverage.py check reports/*/coverage.json
  setup:
    name: Contributor setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned vcpkg bootstrap
        id: vcpkg-bootstrap-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .dev-tools/vcpkg
            !.dev-tools/vcpkg/buildtrees/**
            !.dev-tools/vcpkg/packages/**
            !.dev-tools/vcpkg/installed/**
            !.dev-tools/vcpkg/downloads/**
            !.dev-tools/vcpkg/binary-cache/**
          key: vcpkg-bootstrap-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/media_sdk.py') }}
      - name: Verify and prepare pinned vcpkg bootstrap
        shell: bash
        run: python3 tools/media_sdk.py bootstrap
      - name: Save verified vcpkg bootstrap
        if: steps.vcpkg-bootstrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .dev-tools/vcpkg
            !.dev-tools/vcpkg/buildtrees/**
            !.dev-tools/vcpkg/packages/**
            !.dev-tools/vcpkg/installed/**
            !.dev-tools/vcpkg/downloads/**
            !.dev-tools/vcpkg/binary-cache/**
          key: ${{ steps.vcpkg-bootstrap-cache.outputs.cache-primary-key }}
      - uses: actions/cache@v4
        with:
          path: .dev-tools/vcpkg-binary-cache
          key: ffmpeg-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/media_sdk.py') }}
          restore-keys: ffmpeg-sdk-${{ runner.os }}-${{ runner.arch }}-
      - name: Preview and run setup
        run: |
          tools/setup-dev.sh --dry-run --build
          tools/setup-dev.sh --build
