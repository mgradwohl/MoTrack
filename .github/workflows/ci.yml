name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
      - name: Load toolchain pins
        shell: bash
        # tools/toolchain.env holds every pinned version the setup scripts use, as KEY=value lines.
        run: grep -E '^[A-Z0-9_]+=' tools/toolchain.env >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.MOTRACK_PYTHON_VERSION }}
      - name: Test developer setup tools
        shell: bash
        run: python -m unittest discover -s tests -p test_dev_tools.py
      - name: Check Tracker application reference
        if: runner.os == 'Linux'
        run: |
          python tools/corpus.py fetch
          python tools/corpus.py reference --java "$JAVA_HOME_17_X64/bin/java"
          python tools/corpus.py expression-oracle --java "$JAVA_HOME_17_X64/bin/java"
          python tools/corpus.py session --java "$JAVA_HOME_17_X64/bin/java"
      - name: Check ODE solver kernel reference
        if: runner.os == 'Linux'
        run: python tools/corpus.py ode-oracle --java "$JAVA_HOME_17_X64/bin/java"
      - name: Check image sampling kernel reference
        if: runner.os == 'Linux'
        run: python tools/corpus.py sampling-oracle --java "$JAVA_HOME_17_X64/bin/java"
      - name: Check motion kernel reference
        if: runner.os == 'Linux'
        run: python tools/corpus.py motion-oracle --java "$JAVA_HOME_17_X64/bin/java"
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
      - name: Check Data Tool analysis kernel reference
        if: runner.os == 'Linux'
        run: python tools/corpus.py analysis-oracle --java "$JAVA_HOME_17_X64/bin/java"
      - name: Check video filter kernel reference
        if: runner.os == 'Linux'
        run: python tools/corpus.py filter-oracle --java "$JAVA_HOME_17_X64/bin/java"
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.MOTRACK_QT_VERSION }}
          # Its own setup-python (">=3.14.0") would replace the pinned Python on PATH for every later step.
          setup-python: false
      - name: Set up Windows SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Select Windows LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The image's MSVC STL (14.52+) refuses Clang older than 22, and the preinstalled LLVM is 20.
          # Install the pinned official LLVM MSI (LLVM 23 ships MSI, not NSIS), verified by the release
          # asset's SHA-256 from tools/toolchain.env, into the default location tools/setup-dev.ps1 uses.
          $version = $env:MOTRACK_LLVM_VERSION
          $name = "LLVM-$version-win64.msi"
          $installer = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$name" -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 10
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:MOTRACK_LLVM_WIN64_SHA256) { throw "Unexpected $name SHA-256 $hash" }
          $log = Join-Path $env:RUNNER_TEMP 'llvm-msi.log'
          $process = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
          # 3010 means "succeeded, restart needed", which a CI runner never needs. A missing log must not
          # replace the installer's exit code.
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) { Get-Content -LiteralPath $log -Tail 40 -ErrorAction SilentlyContinue; exit $process.ExitCode }
          $llvm = Join-Path $env:ProgramFiles 'LLVM/bin'
          $reported = & (Join-Path $llvm 'clang++.exe') --version | Select-Object -First 1
          if ($reported -notmatch "version $([regex]::Escape($version))\b") { throw "Expected clang $version, found: $reported" }
          $reported
          $llvm | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_BIN=$llvm" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          choco install ccache --version $env:MOTRACK_CCACHE_VERSION --yes --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "$env:ChocolateyInstall/bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Linux LLVM, libstdc++ and Qt system libraries
        if: runner.os == 'Linux'
        run: |
          # The pinned LLVM major from apt.llvm.org's signed repository (llvm-cov and llvm-profdata for
          # coverage; libclang-rt for the profile runtime), and GCC 14's libstdc++, never libc++, since
          # Qt's Linux binaries use libstdc++ (cmake/MoTrackLibstdcxx.cmake).
          tools/add-llvm-apt-source.sh
          apt=(sudo apt-get -o Acquire::Retries=5)
          "${apt[@]}" update
          "${apt[@]}" install -y ccache "clang-$MOTRACK_LLVM_MAJOR" "clang-format-$MOTRACK_LLVM_MAJOR" "clang-tidy-$MOTRACK_LLVM_MAJOR" \
            "llvm-$MOTRACK_LLVM_MAJOR" "libclang-rt-$MOTRACK_LLVM_MAJOR-dev" "g++-$MOTRACK_GCC_MAJOR" libgl1-mesa-dev libxkbcommon-dev
          "${apt[@]}" install -y build-essential pkg-config autoconf automake libtool nasm patchelf libxcb-cursor0
          llvm="/usr/lib/llvm-$MOTRACK_LLVM_MAJOR/bin"
          echo "$llvm" >> "$GITHUB_PATH"
          echo "LLVM_BIN=$llvm" >> "$GITHUB_ENV"
          echo "MOTRACK_GCC_INSTALL_DIR=/usr/lib/gcc/x86_64-linux-gnu/$MOTRACK_GCC_MAJOR" >> "$GITHUB_ENV"
      - name: Check Linux toolchain
        if: runner.os == 'Linux'
        run: tools/check-prereqs.sh --tools-only
      - name: Select Apple Clang
        if: runner.os == 'macOS'
        run: |
          brew install ccache pkgconf autoconf automake libtool nasm
          llvm="$(dirname "$(xcrun --find clang++)")"
          echo "$llvm" >> "$GITHUB_PATH"
          echo "LLVM_BIN=$llvm" >> "$GITHUB_ENV"
      - name: Restore pinned vcpkg bootstrap
        id: vcpkg-bootstrap-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .dev-tools/vcpkg
            !.dev-tools/vcpkg/buildtrees/**
            !.dev-tools/vcpkg/packages/**
            !.dev-tools/vcpkg/installed/**
            !.dev-tools/vcpkg/downloads/**
            !.dev-tools/vcpkg/binary-cache/**
          key: vcpkg-bootstrap-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/media_sdk.py') }}
      - name: Verify and prepare pinned vcpkg bootstrap
        shell: bash
        run: python tools/media_sdk.py bootstrap
      - name: Save verified vcpkg bootstrap
        if: steps.vcpkg-bootstrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .dev-tools/vcpkg
            !.dev-tools/vcpkg/buildtrees/**
            !.dev-tools/vcpkg/packages/**
            !.dev-tools/vcpkg/installed/**
            !.dev-tools/vcpkg/downloads/**
            !.dev-tools/vcpkg/binary-cache/**
          key: ${{ steps.vcpkg-bootstrap-cache.outputs.cache-primary-key }}
      - name: Restore media library binary cache
        id: media-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .dev-tools/vcpkg-binary-cache
          key: ffmpeg-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/media_sdk.py') }}
          restore-keys: ffmpeg-sdk-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up pinned media libraries
        id: media
        shell: bash
        run: |
          python tools/media_sdk.py install
          prefix="$(python tools/media_sdk.py prefix)"
          echo "MOTRACK_FFMPEG_ROOT=$prefix" >> "$GITHUB_ENV"
          if [[ -d "$prefix/bin" ]]; then echo "$prefix/bin" >> "$GITHUB_PATH"; fi
      # Saved as soon as the libraries are built, so a later failure or timeout does not make the next
      # run rebuild FFmpeg (about 26 minutes on Windows). vcpkg still checks each package's ABI hash.
      - name: Save media library binary cache
        if: steps.media.outcome == 'success' && steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .dev-tools/vcpkg-binary-cache
          key: ${{ steps.media-cache.outputs.cache-primary-key }}
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', '.github/workflows/ci.yml') }}-
      - name: Configure and build
        shell: bash
        run: |
          ccache --version
          cmake --preset coverage -DMOTRACK_BUILD_BENCHMARKS=ON
          cmake --build --preset coverage
          ccache --show-stats
      - name: Check Windows setup scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($test in 'test-setup-dev.ps1', 'test-check-prereqs.ps1') {
            pwsh -NoProfile -File "tools/$test"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          tools/setup-dev.ps1 -DryRun -Build
          tools/check-prereqs.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test and collect coverage
        shell: bash
        run: python tools/coverage.py collect build/coverage coverage.json --llvm-bin "$LLVM_BIN"
      - name: Check Tracker reference corpus
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_corpus*.py'
          python tools/corpus.py fetch
          probe=build/coverage/motrack_corpus_probe
          if [[ "$RUNNER_OS" == Windows ]]; then probe="$probe.exe"; fi
          python tools/corpus.py check --probe "$probe"
          python tools/corpus.py xml-oracle --o2-only --probe "$probe" --reports "$RUNNER_TEMP/xml-o2"
      - name: Check OSP XMLControl reader against Java (O1/O2)
        if: runner.os == 'Linux'
        shell: bash
        run: python tools/corpus.py xml-oracle --probe build/coverage/motrack_corpus_probe --java "$JAVA_HOME_17_X64/bin/java"
          python tools/corpus.py state-check --probe "$probe"
      - name: Check ODE solver kernel reference with arm64 Java
        # HotSpot on arm64 computes Math.pow with fdlibm rather than the x86-64 intrinsic.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          java_home="${JAVA_HOME_17_arm64:-$(/usr/libexec/java_home -v 17)}"
          python tools/corpus.py ode-oracle --java "$java_home/bin/java"
      - name: Check Data Tool analysis kernel reference with arm64 Java
        # HotSpot on arm64 may round Math.sin/cos differently; the FFT tolerance must cover it.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          java_home="${JAVA_HOME_17_arm64:-$(/usr/libexec/java_home -v 17)}"
          python tools/corpus.py analysis-oracle --java "$java_home/bin/java"
      - name: Check edited Tracker round trip
        if: runner.os == 'Linux'
        shell: bash
        run: python tools/corpus.py roundtrip --probe build/coverage/motrack_corpus_probe --java "$JAVA_HOME_17_X64/bin/java"
      - name: Check template matching kernel reference
        if: runner.os == 'Linux'
        shell: bash
        run: python tools/corpus.py match-oracle --java "$JAVA_HOME_17_X64/bin/java"
      - name: Stage desktop build
        shell: bash
        run: |
          cmake --preset stage
          cmake --build --preset stage
          cmake --install build/stage --prefix "$PWD/build/stage/installed"
      - name: Smoke test staged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH,Env:QT_QPA_PLATFORM_PLUGIN_PATH,Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          & ./build/stage/installed/bin/motrack.exe --smoke-test tests/fixtures/image-sequence.trk
          exit $LASTEXITCODE
      - name: Smoke test staged Unix app
        if: runner.os != 'Windows'
        shell: bash
        run: |
          app=build/stage/installed/bin/motrack
          unset QT_PLUGIN_PATH QT_QPA_PLATFORM_PLUGIN_PATH QT_QPA_PLATFORM LD_LIBRARY_PATH DYLD_LIBRARY_PATH DYLD_FRAMEWORK_PATH
          if [[ "$RUNNER_OS" == macOS ]]; then
            bundle=build/stage/installed/motrack.app/Contents
            test -f "$bundle/Frameworks/QtXml.framework/QtXml"
            app="$bundle/MacOS/motrack"
          else
            test -f build/stage/installed/plugins/platforms/libqxcb.so
            export QT_QPA_PLATFORM=offscreen
          fi
          PATH=/usr/bin:/bin "$app" --smoke-test tests/fixtures/image-sequence.trk
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.json
          if-no-files-found: error
  tracker-state:
    name: Tracker loaded-state oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Regenerate and diff Tracker loaded-state dumps and known defects
        run: |
          python tools/corpus.py fetch
          python tools/corpus.py state-oracle --java "$JAVA_HOME_17_X64/bin/java"
      - name: Upload regenerated dumps for review
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tracker-state-dumps
          path: .dev-tools/tracker-reference/state-generated
          if-no-files-found: ignore
  coverage:
    name: 90% line coverage
    needs: [build, setup, tracker-state]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: reports
      - run: python3 tools/coverage.py check reports/*/coverage.json
  setup:
    name: Contributor setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned vcpkg bootstrap
        id: vcpkg-bootstrap-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .dev-tools/vcpkg
            !.dev-tools/vcpkg/buildtrees/**
            !.dev-tools/vcpkg/packages/**
            !.dev-tools/vcpkg/installed/**
            !.dev-tools/vcpkg/downloads/**
            !.dev-tools/vcpkg/binary-cache/**
          key: vcpkg-bootstrap-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/media_sdk.py') }}
      - name: Verify and prepare pinned vcpkg bootstrap
        shell: bash
        run: python3 tools/media_sdk.py bootstrap
      - name: Save verified vcpkg bootstrap
        if: steps.vcpkg-bootstrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .dev-tools/vcpkg
            !.dev-tools/vcpkg/buildtrees/**
            !.dev-tools/vcpkg/packages/**
            !.dev-tools/vcpkg/installed/**
            !.dev-tools/vcpkg/downloads/**
            !.dev-tools/vcpkg/binary-cache/**
          key: ${{ steps.vcpkg-bootstrap-cache.outputs.cache-primary-key }}
      - name: Restore media library binary cache
        id: media-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .dev-tools/vcpkg-binary-cache
          key: ffmpeg-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/media_sdk.py') }}
          restore-keys: ffmpeg-sdk-${{ runner.os }}-${{ runner.arch }}-
      - name: Preview and run setup
        env:
          # Ubuntu installs Qt through the verified download.qt.io path, aqtinstall's fallback, so both
          # ways a contributor can get Qt are exercised; macOS uses aqtinstall.
          MOTRACK_QT_SOURCE: ${{ matrix.os == 'ubuntu-24.04' && 'direct' || 'auto' }}
        run: |
          tools/setup-dev.sh --dry-run --build
          tools/setup-dev.sh --build
      # setup-dev.sh builds the media libraries before it builds and tests MoTrack, so the cache is saved
      # once both libraries are installed, even when a later part of setup fails.
      - name: Save media library binary cache
        if: >-
          always() && steps.media-cache.outputs.cache-hit != 'true' &&
          hashFiles('.dev-tools/vcpkg/installed/*/share/ffmpeg/FindFFMPEG.cmake') != '' &&
          hashFiles('.dev-tools/vcpkg/installed/*/include/archive.h') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .dev-tools/vcpkg-binary-cache
          key: ${{ steps.media-cache.outputs.cache-primary-key }}
      - name: Check C++ format and static analysis
        if: runner.os == 'Linux'
        run: |
          source tools/dev-env.sh
          clang-format --version
          clang-tidy --version
          cmake --preset dev -DMOTRACK_BUILD_BENCHMARKS=ON
          cmake --build --preset dev --parallel 2
          git ls-files -z -- '*.cpp' '*.hpp' | xargs -0 clang-format --dry-run --Werror
          git ls-files -z -- 'src/*.cpp' 'tests/*.cpp' 'benchmarks/*.cpp' | xargs -0 -n 1 -P 2 clang-tidy -p build/dev
